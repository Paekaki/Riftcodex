<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Riftbound Sim</title>
<style>
:root{--bg:#f1ece0;--sf:#fffdf8;--tx:#1d1b16;--mu:#756f63;--ac:#b8862b;--bd:#ddd6c6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0f1220;--sf:#1a1f33;--tx:#ece8dd;--mu:#9aa0b8;--ac:#e0b04f;--bd:#30375a}}
*{box-sizing:border-box}html,body{margin:0;color:var(--tx);font:15px system-ui,sans-serif;background:var(--bg) radial-gradient(circle at 50% -10%,color-mix(in srgb,var(--ac) 22%,transparent),transparent 60%) no-repeat}
body{padding:0 12px 90px}h1{font-size:19px;margin:0;letter-spacing:.5px}
.top{display:flex;justify-content:space-between;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(8px);padding:10px 0;z-index:5}
.coin{font-weight:700;color:var(--ac);background:var(--sf);border:1px solid var(--bd);padding:5px 12px;border-radius:20px}
button,select,textarea{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:9px 12px}
button.p{background:linear-gradient(135deg,#f0c56a,#c28a2c);color:#1a1405;border:0;font-weight:700;box-shadow:0 3px 10px #c28a2c55}button.big{font-size:17px;padding:13px 26px}button:disabled{opacity:.4}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}
.c{background:var(--sf);border:2px solid var(--r);border-radius:11px;padding:5px;font-size:11px;position:relative;box-shadow:0 2px 8px #0003}
.rg .c{animation:fi .45s both;animation-delay:var(--d,0ms)}@keyframes fi{from{opacity:0;transform:translateY(50px) scale(.6)}}
.im{position:relative;aspect-ratio:744/1039;background:var(--bd);border-radius:7px;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px}
.im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.c small{color:var(--r);font-weight:700;display:block;margin-top:4px}.c i{font-style:normal;color:var(--mu)}
.c.f .im::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,#fff6 50%,transparent 70%);background-size:200% 100%;animation:sh 2.5s infinite}@keyframes sh{from{background-position:200% 0}to{background-position:-100% 0}}
.c.x{opacity:.6}.c.x img{filter:grayscale(1) brightness(.3)}
.bk{position:absolute;inset:0;border-radius:9px;background:repeating-linear-gradient(45deg,#232846,#232846 8px,#2d3459 8px,#2d3459 16px);display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--ac);z-index:3;transition:transform .35s,opacity .35s}
.c:not(.hid) .bk{transform:rotateY(90deg);opacity:0;pointer-events:none}.c.hid{cursor:pointer}
.c.gl{animation:gl 1.3s ease-out}@keyframes gl{0%{box-shadow:0 0 0 var(--r)}40%{box-shadow:0 0 30px 9px var(--r)}100%{box-shadow:0 0 12px var(--r)}}
.c button{width:100%;padding:5px;font-size:11px;margin-top:4px}
.n{position:absolute;top:8px;right:8px;z-index:2;background:var(--sf);border-radius:8px;padding:1px 6px;font-weight:700}
.pack{width:58%;max-width:230px;aspect-ratio:2/3;margin:14px auto;filter:drop-shadow(0 14px 22px #0008);animation:flt 3s ease-in-out infinite;cursor:pointer}.pack img,.pk{width:100%;height:100%;object-fit:contain;display:block}
@keyframes flt{50%{transform:translateY(-8px) rotate(-1.5deg)}}
.pack.t{animation:shk .22s 4,bst .3s .88s forwards}@keyframes shk{25%{transform:rotate(-7deg) scale(1.06)}75%{transform:rotate(7deg) scale(1.06)}}@keyframes bst{to{transform:scale(2.4);opacity:0;filter:brightness(4)}}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;border:0;border-radius:0;background:none;padding:9px 2px;color:var(--mu);font-size:11px;line-height:1.5}nav button span{display:block;font-size:20px}nav button.on{color:var(--ac);font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}.mu{color:var(--mu);font-size:13px}
.warn{background:var(--sf);border:1px solid var(--ac);border-radius:12px;padding:10px;margin:8px 0}
textarea{width:100%;height:120px}.t{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:20px;z-index:9}
.gg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.gc{height:84px;font-size:32px;padding:0}
</style></head><body>
<div class="top"><h1>✦ Riftbound Sim</h1><span class="coin" id="co"></span></div>
<div id="v"></div>
<nav><button data-t="o"><span>🎴</span>Abrir</button><button data-t="a"><span>📖</span>Álbum</button><button data-t="m"><span>🛒</span>Mercado</button><button data-t="j"><span>🎯</span>Minijuego</button><button data-t="s"><span>⚙️</span>Ajustes</button></nav>
<script>
const API='https://api.riftcodex.com/cards',PACK=100,K=20,EXP=.7;
const RC={C:'#8a8f98',U:'#3fa66b',R:'#3b82f6',E:'#a855f7',S:'#f59e0b',T:'#64748b'},RN={C:'Común',U:'Poco común',R:'Rara',E:'Épica',S:'Showcase',T:'Runa'};
// Precio base por rareza (€) y oferta de referencia (copias a la venta). Las firmadas (Signature) multiplican x50 el precio y esperan 6 veces menos oferta.
const BASE={C:.05,U:.12,R:.6,E:4,S:40,T:.02},REF={C:3000,U:1500,R:400,E:120,S:30,T:5000};
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let st;try{st=JSON.parse(localStorage.getItem('rb3'))}catch(e){}
st=st||{coins:1000,inv:{},pool:[],labels:{},set:'',day:0,bought:[],cd:0,prices:{},api:0,msg:''};
const save=()=>{try{localStorage.setItem('rb3',JSON.stringify(st))}catch(e){}};
const $=id=>document.getElementById(id);let tab='o',last=[],busy=0,gm=null,ph='i',rs=new Set();
function est(c){const o=st.prices[c.n.toLowerCase()];if(o&&o.p!=null)return o.p;let b=BASE[c.r]*(c.g?50:1);
if(o&&o.a>0){const ref=REF[c.r]/(c.g?6:1);b*=Math.min(30,Math.max(.2,Math.pow(ref/o.a,.6)))}return +b.toFixed(2)}
const W=c=>Math.pow(Math.max(c.p,.01),-EXP),sellV=c=>Math.max(1,Math.floor(c.p*K*.7)),sets=()=>Object.keys(st.labels),fp=p=>p>=100?p.toFixed(0):p.toFixed(2);
const rar=c=>{const cl=c.classification||{},t=String(cl.type||cl.supertype||'').toLowerCase(),r=String(cl.rarity||c.rarity||'').toLowerCase();
if(/rune|token/.test(t))return'T';if(/showcase|overnumber|ultimate|signature|alt/.test(r))return'S';if(r.includes('uncommon'))return'U';if(r.includes('common'))return'C';if(r.includes('epic'))return'E';if(r.includes('rare'))return'R';return null};
async function load(){if(busy)return;busy=1;try{const out=[],lab={};let p=1,pg=1,sz=100;
do{st.msg=`Descargando cartas… ${p}/${pg}`;draw();const r=await fetch(`${API}?size=${sz}&page=${p}`);
if(!r.ok){if(sz>50){sz=50;continue}throw new Error(r.status)}
const j=await r.json();pg=j.pages||1;
for(const c of j.items||[]){const k=rar(c),s=c.set&&c.set.set_id;if(!k||!s)continue;lab[s]=c.set.label||s;const o={u:String(c.id),s,n:c.name,r:k,g:/signature/i.test(JSON.stringify(c))?1:0,im:(c.media&&c.media.image_url)||''};o.p=est(o);out.push(o)}
p++}while(p<=pg);
if(out.length<50)throw new Error('sin datos');st.pool=out;st.labels=lab;st.api=1;if(!lab[st.set])st.set=Object.keys(lab)[0];st.msg='';save()}
catch(e){st.msg='No se pudieron descargar las cartas ('+e.message+'). Revisa la conexión y reintenta.'}busy=0;draw()}
function toast(m){const d=document.createElement('div');d.className='t';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
function pick(set,rl){let l=st.pool.filter(c=>c.s==set&&rl.includes(c.r));if(!l.length)l=st.pool.filter(c=>c.s==set);
let x=Math.random()*l.reduce((a,c)=>a+W(c),0);for(const c of l){x-=W(c);if(x<=0)return c}return l[l.length-1]}
const rr=()=>{const x=Math.random();return x<.83?'R':x<.96?'E':'S'};
function open(){if(ph=='t')return;if(st.coins<PACK)return toast('Monedas insuficientes');st.coins-=PACK;const s=st.set,a=[];
for(let i=0;i<7;i++)a.push([pick(s,['C']),0]);for(let i=0;i<3;i++)a.push([pick(s,['U']),0]);
a.push([pick(s,Math.random()<.5?['C']:['U']),1],[pick(s,[rr()]),1],[pick(s,[rr()]),1],[pick(s,['T']),0]);
a.forEach(([c])=>st.inv[c.u]=(st.inv[c.u]||0)+1);last=a.sort((x,y)=>x[0].p-y[0].p);rs=new Set();save();ph='t';draw();setTimeout(()=>{ph='r';draw()},1150)}
const hue=s=>[...s].reduce((a,c)=>a*31+c.charCodeAt(0),7)%360;
function svgPack(s){const h=hue(s),l=esc(st.labels[s]||s);return`<svg class="pk" viewBox="0 0 200 300"><defs><linearGradient id="g${s}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${h} 70% 55%)"/><stop offset="1" stop-color="hsl(${(h+55)%360} 75% 22%)"/></linearGradient></defs>
<rect x="10" y="8" width="180" height="284" rx="9" fill="url(#g${s})"/><rect x="10" y="8" width="180" height="20" rx="9" fill="#0003"/><rect x="10" y="272" width="180" height="20" rx="9" fill="#0003"/>
<path d="M10 28H190M10 272H190" stroke="#fff4" stroke-dasharray="3 3"/><circle cx="100" cy="125" r="52" fill="none" stroke="#ffffffaa" stroke-width="3"/><circle cx="100" cy="125" r="40" fill="#0002"/><text x="100" y="140" text-anchor="middle" font-size="44" fill="#fff">✦</text>
<text x="100" y="212" text-anchor="middle" font-size="12" fill="#fffc" letter-spacing="3">RIFTBOUND</text><text x="100" y="240" text-anchor="middle" font-size="${l.length>11?15:20}" font-weight="700" fill="#fff">${l}</text><path d="M10 8L190 292V8Z" fill="#fff" opacity=".09"/></svg>`}
function fb(e){e.outerHTML=svgPack(e.closest('.pack').dataset.s)}
const packHTML=(s,c)=>`<div class="pack ${c}" data-s="${s}"><img src="packs/${s}.png" alt="" onerror="fb(this)"></div>`;
const card=(c,o={})=>`<div class="c ${o.f?'f':''} ${o.x?'x':''} ${o.hid?'hid':''}" data-i="${o.i}" style="--r:${RC[c.r]};--d:${o.d||0}ms">${o.hid?'<div class="bk">✦</div>':''}${o.n>1?`<span class="n">×${o.n}</span>`:''}<div class="im">${esc(c.n)}${c.im?`<img loading="lazy" referrerpolicy="no-referrer" src="${esc(c.im)}" alt="" onerror="this.remove()">`:''}</div><small>${c.g?'★ Firma':RN[c.r]}${o.f?' ✦':''}</small><i>€${fp(c.p)}</i>${o.btn||''}</div>`;
function market(){const d=Math.floor(Date.now()/864e5);if(st.day!=d){st.day=d;st.bought=[]}const r=rng(d),L=[];for(let k=0;k<12;k++){const c=st.pool[Math.floor(r()*st.pool.length)];L.push({k,c,p:Math.max(1,Math.round(c.p*K*(.9+r()*.5)))})}return L}
const sel=()=>`<select id="ss">${sets().map(s=>`<option value="${s}" ${s==st.set?'selected':''}>${esc(st.labels[s])}</option>`).join('')}</select>`;
function dups(){let g=0;st.pool.forEach(c=>{const n=st.inv[c.u]||0;if(n>1){g+=sellV(c)*(n-1);st.inv[c.u]=1}});st.coins+=g;save();toast(g?`+${g} 🪙 por repetidas`:'No tienes repetidas');draw()}
function play(){if(Date.now()<st.cd)return toast('Espera '+Math.ceil((st.cd-Date.now())/1e3)+' s');
let sc=0,t=15,cur=-1,bomb=0;const E=['🔥','💧','⚡','🌿','🌀','✨'],cs=[...document.querySelectorAll('.gc')];
$('go').disabled=true;cs.forEach((b,i)=>b.onclick=()=>{if(i!=cur)return;sc=Math.max(0,sc+(bomb?-2:3));b.textContent='';cur=-1;$('gs').textContent=sc+' 🪙'});
gm=setInterval(()=>{if(cur>=0)cs[cur].textContent='';t-=.65;if(t<=0){clearInterval(gm);gm=null;st.coins+=sc;st.cd=Date.now()+30000;save();toast(`+${sc} 🪙`);draw();return}
cur=Math.floor(Math.random()*12);bomb=Math.random()<.25;cs[cur].textContent=bomb?'💣':E[Math.floor(Math.random()*6)];$('ti').textContent=Math.ceil(t)+' s'},650)}
function rev(e){if(!e.classList.contains('hid'))return;e.classList.remove('hid');const i=+e.dataset.i,c=last[i][0];rs.add(i);if('ES'.includes(c.r)||c.g)e.classList.add('gl');
if(rs.size==last.length&&$('sm'))$('sm').textContent='Valor del sobre: '+last.reduce((a,[x])=>a+sellV(x),0)+' 🪙'}
function draw(){$('co').textContent='🪙 '+st.coins;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));let h='';
if(!st.pool.length){$('v').innerHTML=`<p>${esc(st.msg||'Preparando…')}</p><button class="p" id="rl">Descargar cartas</button>`;if($('rl'))$('rl').onclick=load;return}
if(st.msg&&busy)h+=`<div class="mu">${esc(st.msg)}</div>`;
if(tab=='o'){const no=st.coins<PACK;
if(ph=='r'){h+=`<div class="row"><button id="ra">Revelar todas</button><button class="p" id="op" ${no?'disabled':''}>Otro sobre (${PACK} 🪙)</button></div><div id="sm" class="mu"></div><div class="g rg">${last.map(([c,f],i)=>card(c,{f,i,d:i*60,hid:!rs.has(i)})).join('')}</div>`}
else{h+=`<div class="row">${sel()}</div>${packHTML(st.set,ph=='t'?'t':'')}<div class="row" style="justify-content:center"><button class="p big" id="op" ${no||ph=='t'?'disabled':''}>Abrir sobre (${PACK} 🪙)</button></div>`}
if(no)h+=`<div class="warn">Sin monedas para un sobre. Vende repetidas o juega al minijuego.<div class="row"><button id="dp">Vender repetidas</button><button class="p" data-t2="j">Minijuego</button></div></div>`}
if(tab=='a'){const all=st.pool.filter(c=>c.s==st.set),own=all.filter(c=>st.inv[c.u]);
h+=`<div class="row">${sel()}<span class="mu">${own.length}/${all.length}</span><button id="dp">Vender repetidas</button></div><div class="g">${all.map(c=>st.inv[c.u]?card(c,{n:st.inv[c.u],btn:`<button data-s="${c.u}">Vender ${sellV(c)}🪙</button>`}):card(c,{x:1})).join('')}</div>`}
if(tab=='m'){const m=market(),ms=864e5-(Date.now()%864e5);h+=`<div class="mu row">Se renueva en ${Math.floor(ms/36e5)} h ${Math.floor(ms%36e5/6e4)} min</div><div class="g">${m.map(o=>st.bought.includes(o.k)?'':card(o.c,{btn:`<button class="p" data-b="${o.k}" ${st.coins<o.p?'disabled':''}>Comprar ${o.p}🪙</button>`})).join('')}</div>`}
if(tab=='j'){const w=Math.ceil((st.cd-Date.now())/1e3);h+=`<p><b>Rift Rush</b>: 15 s. Toca las runas (+3 🪙) y evita las bombas (−2 🪙). Si cambias de pestaña pierdes la ronda. Espera 30 s entre rondas.</p><div class="row"><button class="p" id="go">${w>0?'Disponible en '+w+' s':'Jugar'}</button><span id="ti" class="mu"></span><b id="gs" class="coin">0 🪙</b></div><div class="gg">${Array.from({length:12},()=>'<button class="gc"></button>').join('')}</div>`}
if(tab=='s'){const np=Object.keys(st.prices).length;h+=`<p class="mu">${sets().length} sets · ${st.pool.length} cartas · imágenes vía Riftcodex.</p>
<p class="mu"><b>Modelo de precios:</b> precio base por rareza (Común 0,05 € · Poco común 0,12 € · Rara 0,60 € · Épica 4 € · Showcase 40 €), las <b>Firmadas ×50</b> (≈2000 €). Si importas cuántas copias hay a la venta, el precio sube cuando hay poca oferta y baja cuando hay mucha. Si importas el precio real, ese manda. Los drop rates dentro de cada rareza son ∝ precio<sup>−${EXP}</sup>. Precios importados: ${np}.</p>
<div class="row"><button class="p" id="rl">Actualizar cartas</button></div>
<p class="mu">Una carta por línea: <code>nombre,precio,disponibles</code> (deja vacío lo que no tengas) o <code>set,nombre,rareza,precio,disponibles</code>.</p>
<textarea id="im" placeholder="Akali - Rogue Assassin (Signature),2000,4"></textarea><div class="row"><button class="p" id="imp">Importar</button><button id="rs">Reiniciar partida</button></div>
<p class="mu">Fotos de sobres: pon <code>packs/OGN.png</code>, <code>packs/SFD.png</code>… en el repositorio y se usarán; si no existen se dibuja un sobre.</p>`}
$('v').innerHTML=h;
if($('ss'))$('ss').onchange=e=>{st.set=e.target.value;save();draw()};
if($('op'))$('op').onclick=open;if($('dp'))$('dp').onclick=dups;if($('rl'))$('rl').onclick=load;if($('go'))$('go').onclick=play;
document.querySelectorAll('.pack').forEach(p=>p.onclick=open);
document.querySelectorAll('.c.hid').forEach(e=>e.onclick=()=>rev(e));
if($('ra'))$('ra').onclick=()=>document.querySelectorAll('.c.hid').forEach((e,k)=>setTimeout(()=>rev(e),k*110));
if($('sm')&&rs.size==last.length)$('sm').textContent='Valor del sobre: '+last.reduce((a,[x])=>a+sellV(x),0)+' 🪙';
document.querySelectorAll('[data-t2]').forEach(b=>b.onclick=()=>go(b.dataset.t2));
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const c=st.pool.find(x=>x.u==b.dataset.s);st.coins+=sellV(c);if(--st.inv[c.u]<=0)delete st.inv[c.u];save();draw()});
document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const o=market().find(x=>x.k==+b.dataset.b);if(st.coins<o.p)return;st.coins-=o.p;st.inv[o.c.u]=(st.inv[o.c.u]||0)+1;st.bought.push(o.k);save();draw()});
if($('imp'))$('imp').onclick=()=>{let n=0;const f=x=>{x=parseFloat(String(x||'').replace(',','.'));return isNaN(x)?null:x};
$('im').value.split('\n').forEach(l=>{const a=l.split(/[;,\t]/).map(x=>x.trim()),L=a.length>=4,nm=L?a[1]:a[0],p=f(L?a[3]:a[1]),q=f(L?a[4]:a[2]);if(nm&&(p!=null||q!=null)){st.prices[nm.toLowerCase()]={p,a:q};n++}});
if(!n)return toast('Sin líneas válidas');st.pool.forEach(c=>c.p=est(c));save();toast(n+' cartas actualizadas');draw()};
if($('rs'))$('rs').onclick=()=>{if(confirm('¿Borrar todo?')){localStorage.removeItem('rb3');location.reload()}}}
function go(t){if(gm){clearInterval(gm);gm=null}tab=t;draw()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));
draw();if(!st.api)load();
</script></body></html>
